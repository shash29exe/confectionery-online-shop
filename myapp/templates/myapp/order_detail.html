{% extends "myapp/base.html" %}

{% block title %}Детали заказа{% endblock %}

{% block content %}
<div class="order-detail">
    <h1>Детали заказа</h1>
    {% if order %}
        <p>Номер заказа: {{ order.id }}</p>
        <p>Статус: {{ order.status }}</p>
        <p>Сумма: {{ order.total }} ₽</p>
    {% endif %}
</div>
{% endblock %}
